name: mod-builder-check
# The mod builder's own test (mod-builder.yml, tools/ci/mod_builder.py, docs/ios.md "The mod
# builder"): that a game compiled once is taken back by another machine and compiles only the mods.
# On Linux, with the game's library for the desktop standing in for the iPhone's program: the
# mechanism is Cargo's and the builder's file times, the same on every system, and a Linux machine
# is there at once where a Mac is waited for.
#
#   unit   the tool's own tests, and that ios.yml is still the file the builder was read against
#   base   the game compiled from a checkout whose files got the fixed time; kept as an artifact
#   reuse  on a fresh machine and a fresh checkout:
#            1. the same build compiles nothing
#            2. with a catalog mod added, it compiles the mod and nothing of the game
#            3. with one line of the game changed, it compiles the game again (a changed file is
#               never taken for an unchanged one)
#   sweep  (asked for by hand) every mod of the catalog a build can take, 24 at a time, each
#          group built from the kept game on a machine of its own: which mods leave the game as it
#          is, and which make Cargo compile some of it again (a mod that moves one of the game's
#          own crates to another version, or turns on a feature of one), and what.
on:
  workflow_dispatch:
    inputs:
      sweep:
        description: Also build every mod of the catalog from the kept game, 24 at a time
        type: boolean
        default: false
      first:
        description: "Instead: compare two builds of the app, by their artifacts' names (mod-build-<key> or mod-trial-<key>). The first"
        type: string
        default: ""
      second:
        description: The second
        type: string
        default: ""
      staged:
        description: "Instead: two runs' ids (comma between) whose `stage` jobs applied the built-in mods: is their source the same, file for file?"
        type: string
        default: ""
  push:
    branches: [main, "mod-builder-**"]
    paths:
      - .github/workflows/mod-builder-check.yml
      - .github/workflows/mod-builder.yml
      - .github/workflows/ios.yml
      - tools/ci/mod_builder.py
      - tools/ios_native_sdk.py
permissions:
  contents: read
concurrency:
  group: mod-builder-check-${{ github.ref }}
  cancel-in-progress: true
env:
  HORIZON_TELEMETRY_URL: "off"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  # No debug information: the test is what gets compiled, not the program.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The game's library, as the iPhone's program depends on it, and the mod API crate, which that
  # program has too (a mod depends on it) and the desktop's library alone does not.
  GAME: -p horizon-client -p horizon-mod-api --lib --features horizon-client/horizon-extras

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/ci/mod_builder.py --self-test

  # Two builds of the app, file by file and inside the archives they carry: what a build from the
  # kept game has that another has not, or what two builds made the old way differ in anyway.
  apps:
    if: ${{ inputs.first != '' && inputs.second != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare the two apps
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ inputs.first }}
          SECOND: ${{ inputs.second }}
        run: |
          set -euo pipefail
          for name in "$FIRST" "$SECOND"; do
            [[ "$name" =~ ^mod-(build|trial)-[0-9a-f]{24}$ ]] || { echo "::error::$name is not a build's artifact"; exit 1; }
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=10" \
              --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | reverse | .[0].id // empty')
            test -n "$id" || { echo "::error::no artifact $name"; exit 1; }
            mkdir -p "$RUNNER_TEMP/$name"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$name.zip"
            unzip -q "$RUNNER_TEMP/$name.zip" -d "$RUNNER_TEMP/$name"
            mv "$RUNNER_TEMP/$name/HorizonPE-iOS-unsigned.ipa" "$RUNNER_TEMP/$name.ipa"
          done
          python3 tools/ci/mod_builder.py compare "$RUNNER_TEMP/$FIRST.ipa" "$RUNNER_TEMP/$SECOND.ipa"

  # The Mods edition's source is made by a `stage` job in every run (the fifteen built-in mods
  # applied to the release's source). A build from the kept game is fast only if that job makes
  # the same files each time: two runs' results, compared as the builder compares a checkout
  # with the kept game (snapshot one, restore the other).
  staged:
    if: ${{ inputs.staged != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare the two staged sources
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED: ${{ inputs.staged }}
        run: |
          set -euo pipefail
          [[ "$STAGED" =~ ^[0-9]{6,20},[0-9]{6,20}$ ]] || { echo "::error::two run ids, a comma between"; exit 1; }
          n=0
          for run in ${STAGED//,/ }; do
            n=$((n + 1))
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name staged-source --dir "$RUNNER_TEMP/staged-$n"
            mkdir -p "$RUNNER_TEMP/source-$n"
            tar -xzf "$RUNNER_TEMP/staged-$n/staged-source.tar.gz" -C "$RUNNER_TEMP/source-$n"
            echo "run $run: $(find "$RUNNER_TEMP/source-$n" -type f | wc -l) files, $(cat "$RUNNER_TEMP/staged-$n/names.txt")"
          done
          cmp "$RUNNER_TEMP/staged-1/native-mods.json" "$RUNNER_TEMP/staged-2/native-mods.json" \
            && echo "native-mods.json: the same" || echo "::warning::native-mods.json differs"
          python3 tools/ci/mod_builder.py snapshot "$RUNNER_TEMP/source-1" "$RUNNER_TEMP/manifest.json"
          python3 tools/ci/mod_builder.py restore "$RUNNER_TEMP/source-2" "$RUNNER_TEMP/manifest.json" | tee "$RUNNER_TEMP/restore.txt"
          if grep -q '; 0 changed, 0 new, 0 gone$' "$RUNNER_TEMP/restore.txt"; then
            echo "::notice::the two staged sources are the same, file for file"
          else
            echo "::error::the two staged sources differ: a build of the Mods edition from the kept game would compile what read those files"
            exit 1
          fi

  base:
    if: ${{ inputs.first == '' && inputs.staged == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust and the headers the client needs
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev zstd
          bash tools/ci/rustup_install.sh --profile minimal
      - name: Give the source the fixed time
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          python3 tools/ci/mod_builder.py identity "$RUNNER_TEMP/base/identity.json"
          python3 tools/ci/mod_builder.py snapshot . "$RUNNER_TEMP/base/manifest.json"
      - name: Compile the game
        run: |
          set -euo pipefail
          cargo fetch
          # shellcheck disable=SC2086 # GAME is cargo's arguments
          cargo build -v $GAME 2>&1 | python3 tools/ci/mod_builder.py log "$RUNNER_TEMP/build.log"
          python3 tools/ci/mod_builder.py summary "$RUNNER_TEMP/build.log" "The game, from nothing"
      - name: Keep the compiled game
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/base/Cargo.lock"
          du -sh target "$HOME/.cargo/registry"
          python3 tools/ci/mod_builder.py pack "$RUNNER_TEMP/base" --target target --cargo-home "$HOME/.cargo"
          ls -l "$RUNNER_TEMP/base"
      - uses: actions/upload-artifact@v4
        with:
          name: mod-builder-check-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/base/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  reuse:
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # The kept game is looked for among the artifacts, as mod-builder.yml looks for one.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust and the headers the client needs
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev zstd
          bash tools/ci/rustup_install.sh --profile minimal
      - name: Take the compiled game
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: mod-builder-check-base-${{ github.run_id }}-${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Found as mod-builder.yml finds one: by name, among this repository's own runs of the
          # workflow that makes them. And not under another workflow's name.
          if python3 tools/ci/mod_builder.py take "$BASE" "$RUNNER_TEMP/other" \
               --workflow .github/workflows/mod-builder.yml --event "$EVENT"; then
            echo '::error::a kept game of another workflow was taken'
            exit 1
          fi
          python3 tools/ci/mod_builder.py take "$BASE" "$RUNNER_TEMP/base" \
            --workflow .github/workflows/mod-builder-check.yml --event "$EVENT"
          python3 tools/ci/mod_builder.py identity "$RUNNER_TEMP/identity.json"
          python3 tools/ci/mod_builder.py same "$RUNNER_TEMP/base/identity.json" "$RUNNER_TEMP/identity.json"
          python3 tools/ci/mod_builder.py unpack "$RUNNER_TEMP/base" --target target --cargo-home "$HOME/.cargo"
          rm -f "$RUNNER_TEMP"/base/*.tar.*
          python3 tools/ci/mod_builder.py restore . "$RUNNER_TEMP/base/manifest.json"
      - name: The same build compiles nothing
        run: |
          set -euo pipefail
          cargo fetch
          # shellcheck disable=SC2086
          cargo build -v $GAME 2>&1 | python3 tools/ci/mod_builder.py log "$RUNNER_TEMP/same.log"
          python3 tools/ci/mod_builder.py summary "$RUNNER_TEMP/same.log" "The game again, from the compiled game" --strict
      - name: With a mod, only the mod is compiled
        run: |
          set -euo pipefail -f
          mod=$(python3 -c 'import json; m = json.load(open("packaging/ios/catalog-buildable.json"))["mods"]; i = sorted(m)[0]; print(i + "@" + m[i])')
          # Horizon's registry, else this port's copy of its index (packaging/ios/registry).
          curl -fsSL --retry 3 https://horizon-rust.github.io/horizon-mods/index.json -o "$RUNNER_TEMP/index.json" \
            || cp packaging/ios/registry/index.json "$RUNNER_TEMP/index.json"
          python3 tools/ci/mod_builder.py again 4 'ios_native_sdk: ' \
            python3 tools/ios_native_sdk.py add "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/catalog" "$mod"
          cargo fetch
          python3 tools/ci/mod_builder.py lock "$RUNNER_TEMP/base/Cargo.lock" Cargo.lock | tee "$RUNNER_TEMP/lock.txt"
          grep -qx 'lock=same' "$RUNNER_TEMP/lock.txt" || { echo "::error::$mod changes the game's own packages"; exit 1; }
          # shellcheck disable=SC2086
          cargo build -v $GAME -p "hmod-${mod%@*}" 2>&1 | python3 tools/ci/mod_builder.py log "$RUNNER_TEMP/mod.log"
          python3 tools/ci/mod_builder.py summary "$RUNNER_TEMP/mod.log" "The game with $mod" --allow 'hmod-.*' --strict
          grep -q "Compiling hmod-${mod%@*} " "$RUNNER_TEMP/mod.log" || { echo "::error::the mod was not compiled"; exit 1; }
      - name: A changed file of the game is compiled again
        run: |
          set -euo pipefail
          echo '// mod-builder-check: one more line' >> crates/horizon-world/src/lib.rs
          python3 tools/ci/mod_builder.py restore . "$RUNNER_TEMP/base/manifest.json" | tee "$RUNNER_TEMP/restore.txt"
          grep -q 'changed: crates/horizon-world/src/lib.rs' "$RUNNER_TEMP/restore.txt" \
            || { echo '::error::the changed file was taken for the compiled game'"'"'s own'; exit 1; }
          cargo build -v -p horizon-world 2>&1 | python3 tools/ci/mod_builder.py log "$RUNNER_TEMP/changed.log"
          python3 tools/ci/mod_builder.py summary "$RUNNER_TEMP/changed.log" "The game's world crate, with one line changed"
          grep -q 'Compiling horizon-world ' "$RUNNER_TEMP/changed.log" \
            || { echo '::error::a changed file was not compiled again'; exit 1; }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mod-builder-check-logs-reuse
          path: |
            ${{ runner.temp }}/same.log
            ${{ runner.temp }}/mod.log
            ${{ runner.temp }}/changed.log
          retention-days: 7
          if-no-files-found: ignore

  sweep:
    needs: base
    if: ${{ inputs.sweep }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust and the headers the client needs
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev zstd
          bash tools/ci/rustup_install.sh --profile minimal
      - name: Take the compiled game
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: mod-builder-check-base-${{ github.run_id }}-${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 tools/ci/mod_builder.py take "$BASE" "$RUNNER_TEMP/base" \
            --workflow .github/workflows/mod-builder-check.yml --event "$EVENT"
          python3 tools/ci/mod_builder.py identity "$RUNNER_TEMP/identity.json"
          python3 tools/ci/mod_builder.py same "$RUNNER_TEMP/base/identity.json" "$RUNNER_TEMP/identity.json"
          python3 tools/ci/mod_builder.py unpack "$RUNNER_TEMP/base" --target target --cargo-home "$HOME/.cargo"
          rm -f "$RUNNER_TEMP"/base/*.tar.*
          python3 tools/ci/mod_builder.py restore . "$RUNNER_TEMP/base/manifest.json"
      - name: This group's mods, from the kept game
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail -f
          mods=$(python3 -c 'import json, os; m = sorted(json.load(open("packaging/ios/catalog-buildable.json"))["mods"].items()); g = int(os.environ["GROUP"]); print(" ".join(f"{i}@{v}" for i, v in m[g * 24:(g + 1) * 24]))')
          test -n "$mods" || { echo "no mods in this group"; exit 0; }
          echo "group $GROUP: $mods"
          # Horizon's registry, else this port's copy of its index (packaging/ios/registry).
          curl -fsSL --retry 3 https://horizon-rust.github.io/horizon-mods/index.json -o "$RUNNER_TEMP/index.json" \
            || cp packaging/ios/registry/index.json "$RUNNER_TEMP/index.json"
          python3 tools/ci/mod_builder.py again 4 'ios_native_sdk: ' \
            python3 tools/ios_native_sdk.py add "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/catalog" $mods > /dev/null
          cargo fetch
          python3 tools/ci/mod_builder.py lock "$RUNNER_TEMP/base/Cargo.lock" Cargo.lock | tee "$RUNNER_TEMP/lock.txt"
          packages=""
          for mod in $mods; do packages="$packages -p hmod-${mod%@*}"; done
          cargo build -v $GAME $packages 2>&1 | python3 tools/ci/mod_builder.py log "$RUNNER_TEMP/sweep-$GROUP.log"
          {
            echo "### Group $GROUP"
            echo
            echo "$mods"
            echo
            echo "Cargo.lock: $(tail -n 1 "$RUNNER_TEMP/lock.txt")"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ci/mod_builder.py summary "$RUNNER_TEMP/sweep-$GROUP.log" "Group $GROUP from the kept game" --allow 'hmod-.*'
          # What it compiled of this repository's own crates, which is what costs: none is the aim.
          own=$(grep -E '^ +Compiling [^ ]+ v[^ ]+ \(/' "$RUNNER_TEMP/sweep-$GROUP.log" | grep -v 'native-mods-build' | awk '{print $2}' | sort -u | paste -sd' ' - || true)
          echo "::notice::group $GROUP: Cargo.lock $(tail -n 1 "$RUNNER_TEMP/lock.txt" | cut -d= -f2); of the game's own crates compiled: ${own:-none}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mod-builder-check-logs-sweep-${{ matrix.group }}
          path: ${{ runner.temp }}/sweep-*.log
          retention-days: 7
          if-no-files-found: ignore
