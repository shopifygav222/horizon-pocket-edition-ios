name: ios-guard
# The iOS work must leave Starling's desktop and Android builds as Starling has them: rustfmt, and clippy with
# warnings as errors over the client for the desktop and over the Android library, on every push to main.
# The iOS build itself is ios.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-guard-${{ github.ref }}
  cancel-in-progress: true
env:
  # Checks never reach Starling's telemetry server (docs/telemetry.md).
  HORIZON_TELEMETRY_URL: "off"
  CARGO_TERM_COLOR: never

jobs:
  # Its own job, so a layout slip never hides the lint: on failure the log ends with the patch
  # that fixes it (git apply).
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: |
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt
      # The game's modules are found by the build (crates/horizon-client/src/game, no `mod` line
      # cargo fmt follows), so they are formatted by path, as Starling's own CI checks them.
      - name: Formatting
        run: |
          cargo fmt --all
          find crates/horizon-client/src/game -name '*.rs' -print0 | xargs -0 rustfmt --edition 2024 --config skip_children=true
          git diff --exit-code
      # The lockfile is committed as cargo resolves it for this workspace (Starling's, with this
      # port's crates): the native mods' staging reads it --locked (packaging/ios/native_stage.sh),
      # and a release is built from the versions that were tested.
      - name: The lockfile is the one cargo resolves
        id: lock
        if: ${{ !cancelled() }}
        run: |
          git checkout -- .
          cargo metadata --format-version 1 > /dev/null
          if ! git diff --quiet -- Cargo.lock; then
            mkdir -p lock && cp Cargo.lock lock/
            git diff --stat -- Cargo.lock
            echo '::error::Cargo.lock is not what cargo resolves: commit the artifact cargo-lock'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && steps.lock.outcome == 'failure' }}
        with:
          name: cargo-lock
          path: lock/Cargo.lock
          retention-days: 7

  # The mod builds service (packaging/mod-builds-worker): its Worker against a GitHub in memory,
  # and the workflow's side of a build's key, which must be the Worker's.
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the mod builds service
        run: |
          node --test packaging/mod-builds-worker/worker.test.mjs
          python3 tools/mod_build_key.py --self-test
          python3 tools/ios_native_sdk.py --self-test
          python3 packaging/ios/native_stage_cfg.py --self-test

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and the ALSA and udev headers the client links against
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libvulkan1 mesa-vulkan-drivers
          bash tools/ci/rustup_install.sh --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: guard-desktop
          cache-on-failure: true
      # --keep-going: every crate that fails is reported in one run, not only the first. The iOS
      # crates are inert here, and must stay buildable.
      - name: Lint the client for the desktop
        run: |
          cargo clippy --keep-going -p horizon-client -p horizon-gamecontroller --lib --bins -- -D warnings
          cargo clippy --keep-going -p horizon-ios-game --bins -- -D warnings
          cargo clippy --keep-going -p horizon-ios-prepare --all-targets -- -D warnings
          cargo clippy --keep-going -p horizon-friends -p horizon-relay -p horizon-voice --all-targets -- -D warnings
      # A shader pack's blocks (waving leaves): the compact layout of terrain keeps each quad's
      # source block, read back through a pack's own vertex stage on the runner's software GPU
      # (Mesa's, installed above). Without an adapter these fail: nothing passes unrun.
      - name: Test the terrain a shader pack reads, on a software GPU
        env:
          HORIZON_REQUIRE_GPU: 1
        run: |
          cargo test -p horizon-client-render --lib -- --include-ignored compact_records terrain_source_arena_gpu
      # The iOS port's host-testable parts: the installer's pack/assemble round trip; and what the
      # iOS gates touch of Starling's render crate (sessions, the control system, the keypad).
      - name: Test the iOS port's host-side code
        run: |
          cargo test -p horizon-ios-prepare
          cargo test -p horizon-gamecontroller
          # A phone's shader packs: terrain's depth pass and its two parts in one program
          # (Starling's fix after 0.9.0, which drew terrain without the pack).
          cargo test -p horizon-shaders --lib -- the_prepass_output_goes_past_the_varyings
          cargo test -p horizon-client-lib --lib -- ios_releases:: starling_releases:: preparer:: mod_builds:: catalog_page:: whats_new:: a_finger_scrolls_the_offers_both_ways the_fallback_index_parses
          cargo test -p horizon-client-render --lib -- auth:: android_controls keypad:: a_finger_scrolls_from_a_cycle_button_and_drags_a_slider an_ios_screen_reports_its_white_and_headroom hotbar_touch_is_generous_and_slides the_mods_pages_top_is_drawn_in_titled_parts the_native_game_page_says_which_game_runs the_compact_layout_is_kept_where_its_records_are_read
      # Shared worlds: the crate itself (shared-worlds.yml also runs it against an S3 server), the
      # title's screens, the in-game screen, the list, the host's login identity, the save's write
      # count, and the friends tunnel and router guesses.
      - name: Test shared worlds
        if: ${{ !cancelled() }}
        run: |
          cargo test -p horizon-shared-worlds
          cargo test -p horizon-friends
          cargo test -p horizon-relay --test tunnel --test udp
          cargo test -p horizon-client-lib --lib -- title:: shared_screen:: friends_screen:: shared_worlds:: lan::conn:: save::write_count::
      # Voice chat: its crate (voice.yml also builds it for the phones), the host's relay, the
      # client's link, the screens and the microphone button.
      - name: Test voice chat
        if: ${{ !cancelled() }}
        run: |
          cargo test -p horizon-voice
          cargo test -p horizon-client-lib --lib -- lan::voice:: voice_net:: voice_screen:: game::voice::

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install the NDK Starling's APK pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install Rust for Android and cargo-ndk
        run: |
          bash tools/ci/rustup_install.sh --profile minimal --component clippy --target aarch64-linux-android
          cargo install cargo-ndk --version 3.5.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: guard-android
          cache-on-failure: true
      # The compiler's own warnings are errors; clippy's style lints are not: Starling's Android-only
      # code (its launcher, its build card) is linted by nobody upstream and is not this port's to
      # restyle.
      - name: Check the Android library
        run: cargo ndk -t arm64-v8a clippy --keep-going -p horizon-android -- -D warnings -A clippy::all
