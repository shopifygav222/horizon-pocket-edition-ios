name: catalog-content-check
# Which of the catalog's content mods an iPhone runs. A content mod (kind "mod" in the registry's
# index) may carry code as WebAssembly, which an iPhone app is not allowed to run, and the index
# does not say which do: each mod's package is opened here (tools/ios_native_sdk.py `content`).
# The result is packaging/ios/catalog-content.json (the `catalog-content` artifact, to commit): the
# game's catalog offers only the content mods in it, so nobody is offered a mod that can't run.
# The summary names every mod left out, with why.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/catalog-content-check.yml
permissions:
  contents: read
concurrency:
  group: catalog-content-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Open the catalog's content mods
        run: |
          set -euo pipefail
          # Horizon's registry, else this port's copy of its index (packaging/ios/registry).
          curl -fsSL --retry 3 https://horizon-rust.github.io/horizon-mods/index.json -o "$RUNNER_TEMP/index.json" \
            || cp packaging/ios/registry/index.json "$RUNNER_TEMP/index.json"
          python3 tools/ios_native_sdk.py content "$RUNNER_TEMP/index.json" "$RUNNER_TEMP/content.json"
      - name: Write the list and the report
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/content.json" packaging/ios/catalog-content.json <<'PY'
          import datetime, json, os, pathlib, sys
          rows = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          runs = {mod: row["version"] for mod, row in sorted(rows.items()) if "refused" not in row}
          refused = {mod: row for mod, row in sorted(rows.items()) if "refused" in row}
          pathlib.Path(sys.argv[2]).write_text(json.dumps({
              "checked": datetime.date.today().isoformat(),
              "mods": runs,
          }, indent=1) + "\n", encoding="utf-8")
          lines = [f"## Content mods an iPhone runs: {len(runs)} of {len(rows)}", "",
                   "### Left out", "", "| Mod | Version | Why |", "|---|---|---|"]
          for mod, row in refused.items():
              lines.append(f"| {mod} | {row['version']} | {row['refused'].replace('|', ' ')[:200]} |")
          lines += ["", "### Offered", "", ", ".join(runs) or "none"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print(f"{len(runs)} offered, {len(refused)} left out")
          for mod, row in refused.items():
              print(f"left out: {mod} {row['version']}: {row['refused']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-content
          path: packaging/ios/catalog-content.json
          retention-days: 30
          if-no-files-found: error
